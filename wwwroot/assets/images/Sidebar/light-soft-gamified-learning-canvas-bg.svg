<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Light Soft Gamified Learning Canvas pastel background">
  <defs>
    <!-- Base aurora gradients -->
    <linearGradient id="base" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DDF3FF"/>
      <stop offset="0.30" stop-color="#EFFCED"/>
      <stop offset="0.62" stop-color="#FFF1DC"/>
      <stop offset="1" stop-color="#F0E3FF"/>
    </linearGradient>

    <radialGradient id="skyGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(240 120) rotate(34) scale(520 360)">
      <stop offset="0" stop-color="#9EDAFF" stop-opacity="0.82"/>
      <stop offset="0.48" stop-color="#D3F1FF" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#DFF5FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="mintGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(790 430) rotate(18) scale(700 420)">
      <stop offset="0" stop-color="#A8F2D1" stop-opacity="0.78"/>
      <stop offset="0.55" stop-color="#D1F9E5" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#DDFBEC" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="peachGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1570 820) rotate(-26) scale(620 420)">
      <stop offset="0" stop-color="#FFC987" stop-opacity="0.82"/>
      <stop offset="0.50" stop-color="#FFE6BE" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#FFF0D7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="pinkGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1720 150) rotate(-18) scale(480 340)">
      <stop offset="0" stop-color="#FFB8D8" stop-opacity="0.68"/>
      <stop offset="0.52" stop-color="#FFDCEC" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#FFEAF5" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="lavenderGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 955) rotate(22) scale(540 360)">
      <stop offset="0" stop-color="#C8BCFF" stop-opacity="0.82"/>
      <stop offset="0.48" stop-color="#E4DEFF" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#EEE9FF" stop-opacity="0"/>
    </radialGradient>

    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="tinyBlur" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#4DA3F1" opacity="0.16"/>
    </pattern>

    <linearGradient id="leafBlue" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#9BC6FF" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#6C9DFF" stop-opacity="0.24"/>
    </linearGradient>

    <linearGradient id="leafPurple" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#C6B8FF" stop-opacity="0.54"/>
      <stop offset="1" stop-color="#9F8DFF" stop-opacity="0.24"/>
    </linearGradient>

    <linearGradient id="starGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFB73D" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#FF73B7" stop-opacity="0.48"/>
    </linearGradient>
  </defs>

  <!-- Base canvas -->
  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#dotGrid)" opacity="0.72"/>

  <!-- Aurora glows -->
  <rect width="1920" height="1080" fill="url(#skyGlow)"/>
  <rect width="1920" height="1080" fill="url(#mintGlow)"/>
  <rect width="1920" height="1080" fill="url(#peachGlow)"/>
  <rect width="1920" height="1080" fill="url(#pinkGlow)"/>
  <rect width="1920" height="1080" fill="url(#lavenderGlow)"/>

  <!-- Subtle top sweep -->
  <path d="M0 0H1920V128C1578 90 1268 62 943 68C593 74 306 122 0 178V0Z" fill="#FFFFFF" opacity="0.24"/>
  <path d="M0 210C261 150 602 98 1018 113C1338 125 1642 188 1920 264V0H0V210Z" fill="#D8F0FF" opacity="0.42"/>

  <!-- Bottom decorative blobs -->
  <g opacity="0.85" filter="url(#softBlur)">
    <ellipse cx="95" cy="1048" rx="210" ry="110" fill="#C6C0FF" opacity="0.44"/>
    <ellipse cx="1780" cy="1040" rx="230" ry="120" fill="#B7D8FF" opacity="0.44"/>
    <ellipse cx="1550" cy="900" rx="220" ry="130" fill="#FFD39E" opacity="0.34"/>
    <ellipse cx="420" cy="915" rx="260" ry="145" fill="#BFF6DA" opacity="0.30"/>
  </g>

  <!-- Left botanical silhouettes -->
  <g transform="translate(18 792)" opacity="0.68">
    <path d="M40 250C73 207 79 152 64 93" stroke="#9DBDFF" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
    <ellipse cx="42" cy="205" rx="36" ry="82" transform="rotate(-34 42 205)" fill="url(#leafBlue)"/>
    <ellipse cx="93" cy="172" rx="26" ry="72" transform="rotate(26 93 172)" fill="url(#leafPurple)"/>
    <ellipse cx="25" cy="118" rx="23" ry="62" transform="rotate(-30 25 118)" fill="url(#leafBlue)"/>
    <ellipse cx="116" cy="92" rx="20" ry="56" transform="rotate(34 116 92)" fill="url(#leafPurple)"/>
    <ellipse cx="133" cy="220" rx="46" ry="105" transform="rotate(42 133 220)" fill="url(#leafBlue)" opacity="0.62"/>
  </g>

  <!-- Right botanical silhouettes -->
  <g transform="translate(1715 785)" opacity="0.64">
    <path d="M105 260C73 206 73 155 93 90" stroke="#8CB5FF" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
    <ellipse cx="92" cy="204" rx="32" ry="78" transform="rotate(32 92 204)" fill="url(#leafBlue)"/>
    <ellipse cx="38" cy="168" rx="24" ry="70" transform="rotate(-28 38 168)" fill="url(#leafPurple)"/>
    <ellipse cx="142" cy="122" rx="23" ry="62" transform="rotate(30 142 122)" fill="url(#leafBlue)"/>
    <ellipse cx="18" cy="96" rx="19" ry="55" transform="rotate(-32 18 96)" fill="url(#leafPurple)"/>
    <ellipse cx="-10" cy="225" rx="45" ry="103" transform="rotate(-42 -10 225)" fill="url(#leafBlue)" opacity="0.62"/>
  </g>

  <!-- Floating circles and bubbles -->
  <g opacity="0.84">
    <circle cx="1812" cy="130" r="25" fill="#FFB8D8" opacity="0.62"/>
    <circle cx="1848" cy="156" r="12" fill="#FFCFE6" opacity="0.70"/>
    <circle cx="1744" cy="925" r="18" fill="#C1B1FF" opacity="0.64"/>
    <circle cx="1688" cy="938" r="8" fill="#FFC87A" opacity="0.58"/>
    <circle cx="78" cy="965" r="14" fill="#FFBBD6" opacity="0.58"/>
    <circle cx="225" cy="1002" r="10" fill="#C5B4FF" opacity="0.66"/>
    <circle cx="70" cy="646" r="5" fill="#B9A5FF" opacity="0.86" filter="url(#tinyBlur)"/>
    <circle cx="1780" cy="657" r="5" fill="#82B8FF" opacity="0.78" filter="url(#tinyBlur)"/>
  </g>

  <!-- Small decorative stars/sparkles -->
  <g opacity="0.86">
    <path d="M87 890L103 926L140 942L104 958L88 994L72 958L36 942L72 926L87 890Z" fill="url(#starGrad)" opacity="0.66"/>
    <path d="M1785 870L1800 903L1834 918L1800 933L1785 966L1770 933L1736 918L1770 903L1785 870Z" fill="url(#starGrad)" opacity="0.58"/>
    <path d="M45 642L55 665L78 675L55 685L45 708L35 685L12 675L35 665L45 642Z" fill="#FFB73D" opacity="0.58"/>
    <path d="M1687 778L1695 797L1714 805L1695 813L1687 832L1679 813L1660 805L1679 797L1687 778Z" fill="#FFB73D" opacity="0.54"/>
    <path d="M1818 996L1828 1019L1852 1029L1828 1039L1818 1062L1808 1039L1784 1029L1808 1019L1818 996Z" fill="#A897FF" opacity="0.64"/>
    <path d="M228 76L234 91L249 97L234 103L228 118L222 103L207 97L222 91L228 76Z" fill="#FFC45F" opacity="0.38"/>
    <path d="M1510 87L1517 104L1534 111L1517 118L1510 135L1503 118L1486 111L1503 104L1510 87Z" fill="#FF9BD1" opacity="0.40"/>
  </g>

  <!-- Decorative music/learning strokes, very subtle -->
  <g opacity="0.34" stroke-linecap="round" stroke-linejoin="round">
    <path d="M92 705C105 688 123 688 134 704" stroke="#A991FF" stroke-width="3"/>
    <path d="M126 720C138 704 156 704 168 719" stroke="#A991FF" stroke-width="3"/>
    <path d="M1652 706C1666 688 1684 688 1696 705" stroke="#8CB5FF" stroke-width="3"/>
    <path d="M1688 723C1700 706 1719 706 1730 722" stroke="#8CB5FF" stroke-width="3"/>
    <path d="M1820 660C1839 646 1859 648 1874 665" stroke="#BCAEFF" stroke-width="3"/>
  </g>

  <!-- Soft vignette for readability -->
  <rect width="1920" height="1080" fill="#F7FBFF" opacity="0.035"/>
</svg>
