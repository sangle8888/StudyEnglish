    <radialGradient id="amberGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1590 820) rotate(-25) scale(640 430)">
      <stop offset="0" stop-color="#B86D2B" stop-opacity="0.24"/>
      <stop offset="0.52" stop-color="#5A301D" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#5A301D" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="roseGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1720 150) rotate(-18) scale(500 350)">
      <stop offset="0" stop-color="#B84D86" stop-opacity="0.24"/>
      <stop offset="0.54" stop-color="#512142" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#512142" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 955) rotate(22) scale(560 370)">
      <stop offset="0" stop-color="#6756C8" stop-opacity="0.28"/>
      <stop offset="0.52" stop-color="#292458" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#292458" stop-opacity="0"/>
    </radialGradient>

    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="tinyBlur" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8CCBFF" opacity="0.11"/>
    </pattern>

    <linearGradient id="leafBlue" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#5B98E8" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#3159A8" stop-opacity="0.10"/>
    </linearGradient>

    <linearGradient id="leafPurple" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#8B78E8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4B3E9A" stop-opacity="0.09"/>
    </linearGradient>

    <linearGradient id="starGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFC765" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FF7DBB" stop-opacity="0.18"/>
    </linearGradient>
