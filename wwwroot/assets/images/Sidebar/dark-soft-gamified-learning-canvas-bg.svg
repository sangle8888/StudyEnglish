<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dark Soft Gamified Learning Canvas midnight background">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1728"/>
      <stop offset="0.42" stop-color="#101A2C"/>
      <stop offset="0.72" stop-color="#15162A"/>
      <stop offset="1" stop-color="#1A1529"/>
    </linearGradient>

    <radialGradient id="skyGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(260 125) rotate(30) scale(560 370)">
      <stop offset="0" stop-color="#2F8EDC" stop-opacity="0.34"/>
      <stop offset="0.52" stop-color="#174367" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#174367" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="mintGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(760 440) rotate(18) scale(760 440)">
      <stop offset="0" stop-color="#1FAF86" stop-opacity="0.22"/>
      <stop offset="0.56" stop-color="#0F4A41" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#0F4A41" stop-opacity="0"/>
